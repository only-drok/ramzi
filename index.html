<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEV.PROFILE // CODE EDITOR</title>
<meta name="description" content="A creative developer's space — code editor identity." />
<style>
/* ============================================================
   CODE EDITOR IDENTITY  —  single-file site + admin panel
   0 TOKENS  1 BASE  2 CRT/BG  3 LAYOUT  4 CODE WINDOW
   5 STICKERS  6 SECTIONS  7 LOGIN/ADMIN  8 RESPONSIVE
   ============================================================ */

/* ---------- 0. TOKENS (overridden by Theme customizer) ---------- */
:root{
  --bg:#060b09;
  --panel:#0b1512;
  --border:#1b2f27;
  --text:#dbe9e2;
  --text-dim:#7d9a8c;
  --primary:#4ade80;      /* green  */
  --secondary:#38bdf8;    /* blue   */
  --accent:#a855f7;       /* purple */
  --pink:#f472b6;
  --grad:linear-gradient(100deg,var(--primary),var(--secondary) 52%,var(--accent));
  --glow:40;
  --card-radius:12px;
  --btn-radius:6px;
  --content-width:1120px;
  --space:1;
  --title-size:1;
  --sticker-scale:1;
  --speed:1;
  --fx:1;
  /* syntax highlight */
  --syn-keyword:#ff7b72;
  --syn-string:#7ee787;
  --syn-number:#79c0ff;
  --syn-fn:#d2a8ff;
  --syn-comment:#6e7f76;
  --syn-variable:#ffa657;
  --syn-bool:#79c0ff;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace;
}

/* ---------- 1. BASE ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--mono);line-height:1.65;overflow-x:hidden;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:var(--secondary);text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--primary);color:#04060a}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;font-weight:600}

/* ---------- 2. BACKGROUND / CRT ---------- */
.bg-code{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.bg-code span{position:absolute;color:var(--primary);opacity:.06;font-size:14px;white-space:nowrap;
  animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-12vh)}to{transform:translateY(112vh)}}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:calc(.35 * var(--fx));
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 80%)}
.crt{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:calc(.4 * var(--fx));
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
.crt-v{position:fixed;inset:0;z-index:69;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
body.no-fx .bg-code,body.no-fx .crt,body.no-fx .crt-v{display:none}

/* gradient accents (green -> blue -> purple) */
.topbar{border-bottom:none}
.topbar::after{content:"";display:block;height:2px;background:var(--grad);opacity:.85}
.about-name,.section-title{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.about-name .cursor{background:var(--primary);-webkit-background-clip:border-box;background-clip:border-box}
.btn.primary{background:var(--grad);color:#04140a;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 calc(22px * var(--glow) / 100) var(--secondary)}
.about-role{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{background:color-mix(in srgb,var(--secondary) 10%,transparent);border-color:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--border) 90%,transparent)}
.scard,.skill{border-color:color-mix(in srgb,var(--border) 65%,transparent);border-radius:var(--card-radius)}
.scard:hover,.skill:hover{border-color:transparent;box-shadow:0 0 0 1px var(--secondary),0 14px 30px -22px var(--accent)}
.code-window{border-color:color-mix(in srgb,var(--border) 70%,transparent);box-shadow:0 30px 60px -44px #000,0 0 0 1px color-mix(in srgb,var(--secondary) 12%,transparent)}
.cw-lang{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;border-color:transparent}
.about-name,.about-role,.about-bio p,.kv b,.kv span,.scard .st b,.scard .st span,figcaption{unicode-bidi:plaintext}

/* ---------- 3. LAYOUT ---------- */
.wrap{width:min(var(--content-width),92vw);margin:0 auto}
section.block{padding:calc(60px * var(--space)) 0}
.code-note{font-size:.72rem;color:var(--text-dim);letter-spacing:.05em}
.code-note::before{content:"// ";color:var(--primary)}
h2.section-title{font-size:calc(clamp(1.2rem,2.6vw,1.7rem) * var(--title-size));font-weight:600}
.section-title::before{content:"// ";color:var(--primary)}
.section-sub{color:var(--text-dim);max-width:60ch;font-size:.92rem}

/* ---------- 4. TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0}
.logo{display:inline-flex;align-items:center;gap:.4em;color:var(--text);font-size:.9rem;font-weight:600;
  letter-spacing:.04em;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
.logo .dot{color:var(--primary)}
.logo .tag{color:var(--text-dim);font-size:.7rem;border:1px solid var(--border);border-radius:3px;padding:0 .4em}
.logo-avatar{width:30px;height:30px;flex:none;border-radius:var(--logo-avatar-radius,12px);overflow:hidden;
  border:1px solid var(--border);background:var(--panel);display:none}
.logo-avatar.show{display:block}
.logo-avatar img{width:100%;height:100%;object-fit:cover}
.nav-links{display:flex;gap:.2rem}
.nav-links a{padding:.34em .6em;border-radius:4px;color:var(--text-dim);font-size:.82rem}
.nav-links a:hover{color:var(--text);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.nav-right{display:flex;align-items:center;gap:.6rem}
.chip{display:inline-flex;align-items:center;gap:.4em;font-size:.68rem;padding:.26em .6em;border-radius:4px;
  border:1px solid var(--border);background:color-mix(in srgb,var(--primary) 8%,transparent);color:var(--text-dim)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.burger{display:none;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:.35em .55em}
.burger svg{width:18px;height:18px;fill:currentColor;display:block}
.mobile-menu{display:none;flex-direction:column;padding:.4rem 0 .9rem}
.mobile-menu a{padding:.6em .8em;border-radius:4px;color:var(--text-dim);font-size:.9rem}
.topbar.open .mobile-menu{display:flex}

/* ---------- 5. STAGE (hero scene) ---------- */
.stage{display:grid;grid-template-columns:1fr 1.4fr;grid-template-areas:"hello code" "dev code";
  gap:clamp(1.4rem,4vw,3rem);align-items:center;padding:calc(48px * var(--space)) 0 calc(40px * var(--space))}
#helloSticker{grid-area:hello;justify-self:center}
#devSticker{grid-area:dev;justify-self:center}
#codeWindow{grid-area:code;align-self:center;min-width:0}
.sticker{position:relative;display:flex;justify-content:center;align-items:center;
  width:min(100%,var(--sticker-w,340px));animation:stickerFloat calc(6.5s / var(--speed)) ease-in-out infinite;
  will-change:transform;transform-origin:50% 60%;
  filter:drop-shadow(0 0 20px color-mix(in srgb,var(--secondary) 38%,transparent)) drop-shadow(0 20px 26px rgba(0,0,0,.5))}
.sticker img,.sticker .ph-svg{width:100%;height:auto;object-fit:contain;display:block;
  transform:rotate(var(--rot,0deg));transition:transform .35s ease}
.sticker:hover img,.sticker:hover .ph-svg{transform:rotate(var(--rot,0deg)) scale(1.07)}
.sticker .gl{position:absolute;color:var(--secondary);opacity:.55;font-size:.85rem;pointer-events:none;
  animation:glFloat calc(4.5s / var(--speed)) ease-in-out infinite}
.sticker .gl.a{top:-6px;left:2%}.sticker .gl.b{bottom:0;right:0;animation-delay:-1.4s}.sticker .gl.c{top:40%;right:-4%;animation-delay:-2.6s}
@keyframes stickerFloat{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-14px) rotate(.7deg)}}
@keyframes glFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.sticker.dev{--sticker-w:360px}
.sticker.hello{--sticker-w:330px}

/* ---------- 6. CODE WINDOW ---------- */
.code-window{background:var(--panel);border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden;
  box-shadow:0 34px 60px -44px rgba(0,0,0,.95);min-width:0}
.cw-bar{display:flex;align-items:center;gap:.6em;padding:.5em .8em;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--panel) 70%,#000)}
.cw-dots{display:flex;gap:.35em}
.cw-dots i{width:10px;height:10px;border-radius:50%;display:inline-block;background:#3a3a3a}
.cw-dots i:nth-child(1){background:#ff5f56}.cw-dots i:nth-child(2){background:#ffbd2e}.cw-dots i:nth-child(3){background:#27c93f}
.cw-file{font-size:.74rem;color:var(--text-dim);margin-left:.4em}
.cw-lang{margin-left:auto;font-size:.68rem;color:var(--primary);border:1px solid var(--border);border-radius:3px;padding:0 .45em}
.cw-body{display:flex;font-size:.82rem;line-height:1.75;overflow-x:auto;padding:.9rem 0}
.cw-lines{padding:0 .8em 0 1em;text-align:right;color:var(--text-dim);opacity:.55;border-right:1px solid var(--border);
  -webkit-user-select:none;user-select:none;flex:none}
.cw-code{padding:0 1.1em;white-space:pre;flex:1;min-width:0}
.cw-code .cl{min-height:1.75em}
.tk-k{color:var(--syn-keyword)}.tk-s{color:var(--syn-string)}.tk-n{color:var(--syn-number)}
.tk-f{color:var(--syn-fn)}.tk-c{color:var(--syn-comment);font-style:italic}
.tk-b{color:var(--syn-bool)}.tk-v{color:var(--syn-variable)}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--primary);vertical-align:-.15em;margin-left:.1em;
  animation:blink calc(1.1s / var(--speed)) steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ---------- 7. ABOUT / SOCIALS ---------- */
.divider{font-size:.78rem;color:var(--text-dim);margin-bottom:1.4rem;letter-spacing:.02em}
.divider::before{content:"// ";color:var(--primary)}
.about-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:clamp(1.2rem,3vw,2.6rem);align-items:start}
.about-head{display:flex;align-items:center;gap:1rem;margin-bottom:.3rem}
.mini-avatar{width:64px;height:64px;flex:none;border-radius:8px;border:1px solid var(--border);overflow:hidden;background:var(--panel);display:none}
.mini-avatar.show{display:block}
.mini-avatar img{width:100%;height:100%;object-fit:cover}
.about-name{font-size:calc(clamp(1.8rem,4.5vw,3rem) * var(--title-size));letter-spacing:-.01em;margin:0}
.about-name .cursor{height:.8em}
.about-role{color:var(--primary);font-size:.92rem;margin:.3em 0 1rem}
.about-bio{color:var(--text-dim);font-size:.98rem}
.about-bio p{margin:0 0 .9em}
.about-side{border-left:1px solid var(--border);padding-left:1.3rem;display:flex;flex-direction:column;gap:1rem}
.kv{font-size:.82rem}
.kv .row{display:flex;justify-content:space-between;gap:1rem;padding:.35em 0;border-bottom:1px solid var(--border)}
.kv .row:last-child{border-bottom:none}
.kv b{color:var(--text);font-weight:600}
.kv span{color:var(--text-dim)}
.socials{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem;margin-top:1.4rem}
.scard{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border:1px solid var(--border);border-radius:var(--card-radius);
  background:color-mix(in srgb,var(--panel) 70%,transparent);transition:border-color .2s,transform .2s}
.scard:hover{border-color:var(--primary);transform:translateY(-2px)}
.scard .si{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--border);border-radius:5px;color:var(--text)}
.scard .si svg{width:16px;height:16px;fill:currentColor}
.scard.instagram .si{color:#e1306c}.scard.tiktok .si{color:#69c9d0}.scard.telegram .si{color:#2aabee}
.scard.github .si{color:#c9d1d9}.scard.twitter .si{color:#e6e6e6}.scard.linkedin .si{color:#0a66c2}
.scard.youtube .si{color:#ff0000}.scard.discord .si{color:#5865f2}.scard.email .si{color:var(--primary)}
.scard.website .si{color:var(--secondary)}
.scard .st b{display:block;font-size:.84rem;font-weight:600}
.scard .st span{color:var(--text-dim);font-size:.68rem}

/* ---------- 8. CARDS (skills / gallery) ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.skill{padding:1rem 1.05rem;border:1px solid var(--border);border-radius:var(--card-radius);background:color-mix(in srgb,var(--panel) 70%,transparent);
  transition:border-color .2s,transform .2s}
.skill:hover{border-color:var(--primary);transform:translateY(-3px)}
.skill .ic{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;border:1px solid var(--border);color:var(--primary);margin-bottom:.7rem}
.skill .ic svg{width:18px;height:18px;fill:currentColor}
.skill h3{font-size:.95rem;margin:0 0 .25em}
.skill p{color:var(--text-dim);font-size:.82rem;margin:0}
/* gallery — scattered art between code chips */
.gallery-scatter{columns:3;column-gap:1rem}
@media(max-width:900px){.gallery-scatter{columns:2}}
@media(max-width:560px){.gallery-scatter{columns:1}}
.gallery-scatter .gitem,.gallery-scatter .g-chip{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;margin:0 0 1rem}
.gallery-scatter .gitem{position:relative;cursor:pointer}
.gallery-scatter .gitem img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--border);
  transform:rotate(var(--tilt,0deg));transition:transform .45s ease,box-shadow .45s ease}
.gallery-scatter .gitem:hover img{transform:rotate(0deg) scale(1.02);box-shadow:0 18px 40px -22px var(--secondary)}
.gallery-scatter .gitem .ph{aspect-ratio:4/3;border:1px dashed var(--border);border-radius:10px;display:grid;place-items:center;color:var(--text-dim);font-size:.72rem}
.gallery-scatter .gitem figcaption{font-size:.72rem;color:var(--text-dim);margin-top:.4em;font-family:var(--mono)}
.g-chip{background:var(--panel);border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:10px;
  padding:.7rem .85rem;font-family:var(--mono);font-size:.76rem;line-height:1.6;color:var(--text-dim);white-space:pre-wrap;
  animation:chipFloat calc(7s / var(--speed)) ease-in-out infinite}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- 9. FOOTER ---------- */
footer{border-top:1px solid var(--border);padding:1.8rem 0;margin-top:2rem}
footer .row{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:center;color:var(--text-dim);font-size:.78rem}
footer .flinks{display:flex;gap:1rem;flex-wrap:wrap}
footer .flinks a{color:var(--text-dim)}footer .flinks a:hover{color:var(--primary)}
.foot-note::before{content:"// ";color:var(--primary)}

/* ---------- 10. LIGHTBOX / TOAST ---------- */
.lightbox{position:fixed;inset:0;z-index:200;display:none;place-items:center;background:rgba(3,6,5,.94)}
.lightbox.open{display:grid}
.lightbox img{max-width:88vw;max-height:76vh;border:1px solid var(--border);border-radius:6px}
.lb-cap{color:var(--text-dim);text-align:center;margin-top:.8rem;font-size:.82rem}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:color-mix(in srgb,var(--panel) 80%,transparent);
  border:1px solid var(--border);color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.2rem}
.lb-btn.prev{left:3vw}.lb-btn.next{right:3vw}
.lb-close{position:absolute;top:3vh;right:3vw;background:none;border:1px solid var(--border);color:#fff;border-radius:6px;padding:.35em .7em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(24px);z-index:300;background:var(--panel);
  border:1px solid var(--primary);color:var(--text);padding:.6em 1em;border-radius:6px;font-size:.82rem;opacity:0;transition:.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 11. LOGIN ---------- */
.login-screen{position:fixed;inset:0;z-index:250;display:none;place-items:center;background:rgba(3,6,5,.9)}
.login-screen.open{display:grid}
.login-box{width:min(380px,92vw);border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}
.login-box .lb-bar{display:flex;align-items:center;gap:.5em;padding:.5em .8em;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--text-dim)}
.login-box .lb-bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.login-box .lb-body{padding:1.2rem}
.login-box h2{font-size:1.05rem;margin-bottom:1rem}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.72rem;color:var(--text-dim);margin-bottom:.35em}
.field input[type=text],.field input[type=url],.field input[type=password],.field input[type=number],.field textarea,.field select{
  width:100%;padding:.6em .7em;border-radius:5px;background:color-mix(in srgb,var(--bg) 70%,#000);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:.86rem}
.field textarea{min-height:110px;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary)}
.pw-wrap{position:relative}
.pw-wrap .pw-toggle{position:absolute;right:.4em;top:50%;transform:translateY(-50%);background:none;border:1px solid var(--border);
  border-radius:4px;color:var(--text-dim);font-size:.68rem;padding:.2em .45em}
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.44em .8em;border-radius:var(--btn-radius);border:1px solid var(--border);
  background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--text);font-size:.78rem;font-weight:600;transition:.2s}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:#04140a;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 calc(18px * var(--glow) / 100) var(--primary)}
.btn svg{width:15px;height:15px;fill:currentColor}
.hint{font-size:.72rem;color:var(--text-dim);margin-top:.6rem}
.err{font-size:.78rem;color:var(--pink);margin-top:.6rem;min-height:1em}

/* ---------- 12. ADMIN ---------- */
.admin{position:fixed;inset:0;z-index:150;display:none;background:var(--bg)}
.admin.open{display:flex}
.admin-side{width:250px;flex:none;border-right:1px solid var(--border);background:var(--panel);padding:1rem;overflow-y:auto}
.admin-side .brand{font-size:.78rem;color:var(--primary);margin-bottom:1rem;letter-spacing:.05em}
.admin-nav{display:flex;flex-direction:column;gap:.15rem}
.admin-nav button{text-align:left;padding:.5em .7em;border-radius:4px;background:none;border:1px solid transparent;color:var(--text-dim);font-size:.83rem}
.admin-nav button:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);color:var(--text)}
.admin-nav button.active{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--text);border-color:var(--border)}
.admin-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.admin-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--panel) 70%,transparent);flex-wrap:wrap}
.admin-bar .sp{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.mini{font-size:.7rem;padding:.28em .5em;border-radius:4px;border:1px solid var(--border);background:none;color:var(--text)}
.mini:hover{border-color:var(--primary)}
.mini.danger:hover{border-color:var(--pink);color:var(--pink)}
.admin-body{flex:1;overflow-y:auto;padding:1.1rem}
.pane{display:none;max-width:860px}
.pane.active{display:block}
.pane h2{font-size:1.15rem;margin-bottom:.9rem}
.pane h2::before{content:"// ";color:var(--primary)}
.note{font-size:.78rem;color:var(--text-dim);border:1px solid var(--border);border-radius:6px;padding:.7em .9em;margin-bottom:1rem;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.note b{color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.list-item{border:1px solid var(--border);border-radius:6px;padding:.9rem;margin-bottom:.7rem;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.list-item .li-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem}
.range-row{display:flex;align-items:center;gap:.7rem}
.range-row input[type=range]{flex:1;accent-color:var(--primary)}
.range-row .val{font-size:.75rem;color:var(--primary);min-width:3ch;text-align:right}
.swatch{width:42px;height:32px;padding:0;border:1px solid var(--border);border-radius:5px;background:none}
.thumb{max-width:180px;border:1px solid var(--border);border-radius:5px;margin-top:.5rem}
.img-drop{border:1px dashed var(--border);border-radius:6px;padding:1rem;text-align:center;color:var(--text-dim);font-size:.8rem;margin-bottom:1rem}
.img-drop input{display:block;margin:.5rem auto 0;font-size:.78rem}
.theme-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.theme-btn{padding:.5em .8em;border-radius:5px;border:1px solid var(--border);background:none;color:var(--text);font-size:.8rem;display:flex;align-items:center;gap:.45em}
.theme-btn .sw{width:14px;height:14px;border-radius:3px}
.theme-btn.active{border-color:var(--primary)}
.tab-inline{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem}
.tab-inline button{padding:.35em .7em;border-radius:4px;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:.76rem}
.tab-inline button.active{color:var(--text);border-color:var(--primary)}
.kvbox .row{display:flex;justify-content:space-between;gap:1rem;padding:.4em 0;border-bottom:1px solid var(--border);font-size:.82rem}
.kvbox .row:last-child{border-bottom:none}
.kvbox b{color:var(--text)}

/* ---------- 13. RESPONSIVE ---------- */
@media(max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-areas:"hello" "code" "dev";gap:2rem}
  .about-grid{grid-template-columns:1fr}
  .about-side{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:1rem}
  .admin-side{position:absolute;inset:0 auto 0 0;transform:translateX(-105%);transition:transform .25s;z-index:5;width:78vw;max-width:300px}
  .admin.menu-open .admin-side{transform:none}
  .row2{grid-template-columns:1fr}
}
@media(max-width:620px){
  .nav-links{display:none}
  .burger{display:block}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<div class="bg-code" id="bgCode" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="crt-v" aria-hidden="true"></div>
<div class="crt" aria-hidden="true"></div>

<!-- ================= PUBLIC SITE ================= -->
<div id="site">
  <header class="topbar" id="topbar">
    <div class="wrap row">
      <a class="logo" href="#top" id="logoBtn" title=""><span class="logo-avatar" id="logoAvatar" aria-hidden="true"></span><span id="logoText">dev<span class="dot">.</span>profile</span><span class="tag">.js</span></a>
      <nav class="nav-links" id="navLinks"></nav>
      <div class="nav-right">
        <span class="chip"><span class="dot-live"></span><span id="statusText">available</span></span>
        <button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
      </div>
    </div>
    <div class="wrap mobile-menu" id="mobileMenu"></div>
  </header>

  <main id="top">
    <!-- STAGE: hello sticker -> code window -> programmer sticker -->
    <section class="block wrap" id="sec-hero">
      <div class="stage">
        <div class="sticker hello" id="helloSticker">
          <span class="gl a">&lt;/&gt;</span><span class="gl b">{ }</span><span class="gl c">;</span>
        </div>
        <div class="code-window" id="codeWindow">
          <div class="cw-bar">
            <span class="cw-dots"><i></i><i></i><i></i></span>
            <span class="cw-file" id="codeFile">profile.js</span>
            <span class="cw-lang" id="codeLang">JavaScript</span>
          </div>
          <div class="cw-body">
            <div class="cw-lines" id="codeLines"></div>
            <div class="cw-code" id="codeCode"></div>
          </div>
        </div>
        <div class="sticker dev" id="devSticker">
          <span class="gl a">=&gt;</span><span class="gl b">0x1f</span>
        </div>
      </div>
    </section>

    <!-- ABOUT + SOCIALS -->
    <section class="block wrap" id="sec-about">
      <p class="divider" id="aboutDivider">about the developer</p>
      <div class="about-grid">
        <div>
          <div class="about-head">
            <div class="mini-avatar" id="aboutAvatar" aria-hidden="true"></div>
            <div>
              <h1 class="about-name" id="aboutName">Your Name<span class="cursor"></span></h1>
              <p class="about-role" id="aboutRole">creative developer</p>
            </div>
          </div>
          <div class="about-bio" id="aboutBio"></div>
          <div class="socials" id="socialsGrid"></div>
        </div>
        <aside class="about-side">
          <div class="kv" id="aboutKv"></div>
          <div class="about-bio" id="aboutText"></div>
        </aside>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="block wrap" id="sec-skills">
      <h2 class="section-title" id="skillsTitle">skills</h2>
      <p class="section-sub" id="skillsSub"></p>
      <div class="grid-cards" id="skillsGrid" style="margin-top:1.2rem"></div>
    </section>

    <!-- GALLERY -->
    <section class="block wrap" id="sec-gallery">
      <h2 class="section-title" id="galleryTitle">gallery</h2>
      <p class="section-sub" id="gallerySub"></p>
      <div class="gallery-scatter" id="galleryGrid" style="margin-top:1.4rem"></div>
    </section>
  </main>

  <footer>
    <div class="wrap row">
      <span id="footerText"></span>
      <span class="foot-note" id="footNote" aria-hidden="true"></span>
      <span class="flinks" id="footerLinks"></span>
    </div>
  </footer>
</div>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="lb-bar"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i><span id="loginFile">auth.js</span></div>
    <div class="lb-body">
      <h2>Sign in</h2>
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" autocomplete="username" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <div class="pw-wrap">
          <input type="password" id="pwInput" autocomplete="off" placeholder="••••••••" />
          <button class="pw-toggle" id="pwToggle" type="button">show</button>
        </div>
      </div>
      <div class="sp" style="display:flex;gap:.5rem">
        <button class="btn primary" id="loginBtn">Sign in</button>
        <button class="btn" id="loginClose">Close</button>
      </div>
      <div class="err" id="loginErr"></div>
      <p class="hint" id="loginHint"></p>
    </div>
  </div>
</div>

<!-- ================= ADMIN ================= -->
<div class="admin" id="admin">
  <aside class="admin-side">
    <div class="brand">// admin.console</div>
    <nav class="admin-nav" id="adminNav"></nav>
  </aside>
  <div class="admin-main">
    <div class="admin-bar">
      <div class="sp">
        <button class="mini" id="menuToggle">menu</button>
        <span class="chip"><span class="dot-live"></span><span id="sessionLabel">session</span></span>
      </div>
      <div class="sp">
        <button class="mini" id="btnPreview">Preview</button>
        <button class="mini" id="btnSave">Save</button>
        <button class="mini" id="btnCancel">Cancel</button>
        <button class="mini" id="btnRestore">Restore saved</button>
        <button class="mini" id="btnViewSite">View site</button>
        <button class="mini danger" id="btnLogout">Log out</button>
      </div>
    </div>
    <div class="admin-body" id="adminBody"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">close</button>

  <button class="lb-btn next" id="lbNext">›</button>

</div>

var KW='const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|import|export|default|from|as|async|await|yield|try|catch|finally|throw|typeof|instanceof|of|in|this|super';
function highlight(raw){
  var re=new RegExp('(\\/\\/[^\\n]*)|(\\/\\*[\\s\\S]*?\\*\\/)|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\'|`(?:\\\\.|[^`\\\\])*`)|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:'+KW+')\\b)|(\\b(?:true|false|null|undefined|NaN)\\b)|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)','g');
  var out='',last=0,m;
  while((m=re.exec(raw))){
    out+=escHtml(raw.slice(last,m.index));
    var cls=m[1]||m[2]?'c':m[3]?'s':m[4]?'n':m[5]?'k':m[6]?'b':m[7]?'f':'v';
    out+='<span class="tk-'+cls+'">'+escHtml(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  out+=escHtml(raw.slice(last));
  return out;
}

function openLogin(){
  if(sessionValid()){ enterAdmin(); return }
  if(Date.now()<lockUntil){ toast('Too many attempts. Try again shortly.'); return }
  $('#pwInput').value=''; $('#loginErr').textContent=''; $('#loginHint').textContent='';

function tryLogin(){
  var email=($('#emailInput')?$('#emailInput').value.trim():'');
  var val=$('#pwInput').value;
  $('#loginErr').textContent='';
  if(cloudOn){
    if(!email){ $('#loginErr').textContent='Enter your admin email.'; return; }
    fbAuth.signInWithEmailAndPassword(email,val).then(function(){ failCount=0; closeLogin(); enterAdmin(); })
      .catch(function(err){ $('#loginErr').textContent='Sign-in failed: '+(err&&err.code?err.code:(err&&err.message?err.message:'error')); });
    return;
  }
  sha256(val).then(function(h){
    if(h===saved.security.passHash){ failCount=0; closeLogin(); enterAdmin(); }
    else{
      failCount++;
      $('#loginErr').textContent='Invalid credentials.';
      if(failCount>=5){ lockUntil=Date.now()+30000; failCount=0; closeLogin(); toast('Too many attempts. Locked for 30s.'); }
    }
  });
}

    '<p class="hint" id="pwMsg"></p>'+
    '<h3 style="margin:1rem 0 .4rem">Access method</h3>'+
    '<p class="hint">Open the panel with a hidden gesture: tap the logo <b>5 times within 3 seconds</b>, or <b>press and hold the logo for 3 seconds</b>. You can also use the keyboard shortcut Ctrl/Cmd+Shift+E. No admin button or link is shown to visitors.</p>';
  afterInject(pane);
  $('#setPw').addEventListener('click',function(){ var a=$('#newPw').value,b=$('#newPw2').value;
    if(a.length<6){$('#pwMsg').textContent='Use at least 6 characters.';return} if(a!==b){$('#pwMsg').textContent='Passwords do not match.';return}
    sha256(a).then(function(h){draft.security.passHash=h;saved.security.passHash=h;persist();$('#pwMsg').textContent='Password updated and saved.';toast('Password updated.')}); });
}
$('#btnPreview').addEventListener('click',function(){live=clone(draft);render(live,false);toast('Previewing draft.')});
$('#btnSave').addEventListener('click',function(){saved=clone(draft);if(persist())toast(cloudOn&&fbAuth&&fbAuth.currentUser?'Saved & published to everyone.':'Saved to this device (not published).')});
$('#btnCancel').addEventListener('click',function(){draft=clone(saved);live=clone(saved);render(live,false);buildPane(currentTab);toast('Unsaved changes discarded.')});
$('#btnRestore').addEventListener('click',function(){draft=clone(saved);live=clone(saved);render(live,false);buildPane(currentTab);toast('Restored last saved version.')});
$('#btnViewSite').addEventListener('click',function(){$('#admin').classList.remove('open');toast('Site preview open. Use the hidden gesture to return.')});
$('#btnLogout').addEventListener('click',exitAdmin);

/* ---------- 9. boot ---------- */
function boot(){
  render(live,true);
  buildBgCode();
  startSessionWatch();
  if(/[?&]edit=1/.test(location.search)) openLogin();
  idbKeys().then(function(keys){keys.forEach(function(k){imgUrl(k)})}).catch(function(){});
  if(cloudOn){ cloudLoad().then(function(got){ if(got) render(live,false); cloudWatch(); }); }
}
boot();
})();
</script>
</body>
</html>
